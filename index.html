<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>đánh tàu</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
    /* BẢNG MÀU VÀ HIỆU ỨNG MỚI */
    :root {
        --bg-color: #0b132b;
        --panel-bg: rgba(28, 37, 65, 0.85);
        --accent-blue: #00d2ff;
        --accent-green: #2ecc71;
        --accent-red: #ff4b1f;
        --grid-color: rgba(58, 80, 107, 0.5);
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at center, #1c2541 0%, #0b132b 100%);
        color: white;
        text-align: center;
        margin: 0; padding: 0;
        height: 100%; overflow: hidden;
    }
    body {
        padding: 4px; display: flex; flex-direction: column;
        height: 100vh; height: 100dvh;
    }
    h1 { font-size: 16px; margin: 2px 0; color: var(--accent-blue); text-shadow: 0 0 10px var(--accent-blue); text-transform: uppercase; }
    h2 { font-size: 12px; margin: 2px 0; font-weight: normal; color: #a1a1aa; }
    h3 { font-size: 11px; margin: 1px 0; color: #f4f4f5; text-transform: uppercase; }

    /* CONTAINERS */
    .header { 
        background: var(--panel-bg); backdrop-filter: blur(5px);
        padding: 6px; border-radius: 8px; margin-bottom: 3px; flex-shrink: 0;
        border: 1px solid rgba(0, 210, 255, 0.2);
    }
    .header input {
        padding: 7px; border-radius: 5px; border: 1px solid var(--accent-blue); width: 120px;
        text-align: center; letter-spacing: 3px; font-weight: bold; text-transform: uppercase;
        background: rgba(0,0,0,0.5); color: white;
    }
    button {
        padding: 6px 12px; margin: 2px; border-radius: 5px; border: none;
        background: linear-gradient(45deg, #1f4037, #99f2c8); color: #000; font-weight: bold; cursor: pointer;
        font-size: 12px; transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.95); }
    button:disabled { background: #555; color: #888; cursor: not-allowed; opacity: 0.6; transform: none; }
    
    #btn-connect { background: linear-gradient(45deg, #11998e, #38ef7d); color: white; }
    #btn-airstrike { background: linear-gradient(45deg, #f12711, #f5af19); color: white; }
    #btn-airstrike.active { box-shadow: 0 0 15px #f12711; transform: scale(1.05); }
    #btn-cam-mic { background: linear-gradient(45deg, #8E2DE2, #4A00E0); color: white; }
    #my-room-code { font-size: 16px; letter-spacing: 4px; background: rgba(0,0,0,0.6); padding: 3px 10px; border-radius: 6px; display: inline-block; color: var(--accent-blue); }

    .main-container {
        display: flex; flex-direction: column; align-items: center; gap: 3px;
        flex: 1 1 0; min-height: 0; width: 100%; overflow: hidden; position: relative;
    }
    .board-section {
        background: var(--panel-bg); padding: 3px; border-radius: 8px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        flex: 1 1 0; min-height: 0; width: 100%; max-width: 420px;
        border: 1px solid rgba(255,255,255,0.05);
    }
    
    /* BÀN CỜ & Ô CỜ */
    .board {
        display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr);
        gap: 1px; background-color: var(--grid-color); padding: 2px; border-radius: 5px; margin: 0 auto;
    }
    .cell { 
        background-color: rgba(11, 19, 43, 0.8); cursor: pointer; transition: 0.1s; 
        position: relative; display: flex; align-items: center; justify-content: center;
    }
    
    /* HÌNH ẢNH TÀU BẰNG CSS */
    .cell.ship { background-color: #5c6bc0; border: 1px solid #3f51b5; }
    /* Đầu tàu bo tròn, thân vuông */
    .cell.ship.ship-end-top { border-radius: 50% 50% 0 0; background: linear-gradient(to bottom, #9fa8da, #3f51b5); }
    .cell.ship.ship-end-bottom { border-radius: 0 0 50% 50%; background: linear-gradient(to top, #9fa8da, #3f51b5); }
    .cell.ship.ship-end-left { border-radius: 50% 0 0 50%; background: linear-gradient(to right, #9fa8da, #3f51b5); }
    .cell.ship.ship-end-right { border-radius: 0 50% 50% 0; background: linear-gradient(to left, #9fa8da, #3f51b5); }
    .cell.ship.ship-single { border-radius: 50%; background: radial-gradient(circle, #9fa8da, #3f51b5); }
    .cell.ship.ship-h-mid { background: #3f51b5; }

    /* Hiệu ứng khi lướt tay đặt tàu */
    .cell.ship-preview { background: rgba(46, 204, 113, 0.6); }
    .cell.ship-preview-bad { background: rgba(231, 76, 60, 0.6); }

    /* Hiệu ứng bắn Trúng / Trượt */
    .cell.hit { background: radial-gradient(circle, #ff4b1f 0%, #ff9068 100%); pointer-events: none; animation: explode 0.3s ease-out; }
    .cell.hit::after { content: "💥"; position: absolute; font-size: 70%; }
    .cell.miss { background-color: rgba(255,255,255,0.2); pointer-events: none; }
    .cell.miss::after { content: "💧"; position: absolute; font-size: 70%; opacity: 0.7; }
    
    @keyframes explode { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } }

    .hp-bar { font-size: 10px; margin-top: 2px; color: var(--accent-green); flex-shrink: 0; font-weight: bold; letter-spacing: 1px; }

    /* CHAT KHU VỰC DƯỚI */
    .chat-input { display: flex; width: 100%; max-width: 420px; gap: 4px; padding: 2px 0; }
    .chat-input input { flex-grow: 1; padding: 6px; border-radius: 15px; border: none; background: rgba(255,255,255,0.1); color: white; outline: none; padding-left: 10px; }
    .chat-input button { margin: 0; border-radius: 15px; background: var(--accent-blue); padding: 6px 12px; color: black; }

    /* DANMAKU (TIN NHẮN CHẠY NGANG) */
    #danmaku-container {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; overflow: hidden; z-index: 100;
    }
    .danmaku-msg {
        position: absolute; white-space: nowrap; font-size: 16px; font-weight: bold;
        text-shadow: 1px 1px 3px black, -1px -1px 3px black;
        animation: flyAcross 6s linear forwards;
    }
    @keyframes flyAcross {
        0% { transform: translateX(100vw); }
        100% { transform: translateX(-150%); }
    }

    /* CAMERA & MICRO PIP */
    #media-container {
        position: absolute; top: 10px; right: 10px; z-index: 50;
        display: flex; flex-direction: column; gap: 5px;
    }
    video {
        width: 80px; height: 120px; background: black; border-radius: 8px;
        object-fit: cover; border: 2px solid var(--accent-blue); box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    #local-video { transform: scaleX(-1); border-color: var(--accent-green); }

    /* PANEL XẾP TÀU (Đã sửa lại để chạm thay vì kéo) */
    #setup-panel { background: var(--panel-bg); border-radius: 8px; padding: 5px; margin-bottom: 3px; flex-shrink: 0; display: none; }
    .ship-list { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; margin: 3px 0; }
    .ship-choice {
        padding: 6px 10px; background: rgba(0,0,0,0.5); border-radius: 5px; cursor: pointer;
        font-size: 11px; border: 1px solid #555;
    }
    .ship-choice.selected { border-color: var(--accent-green); background: rgba(46, 204, 113, 0.3); box-shadow: 0 0 8px var(--accent-green); }
    .ship-choice.placed { background: #333; opacity: 0.4; pointer-events: none; }
</style>
</head>
<body>

<div class="header">
    <h1>🚢 HẢI CHIẾN PRO 💥</h1>
    <h2 id="status-text">Đang chuẩn bị mạng...</h2>

    <div id="connection-box">
        <p style="margin:3px 0;">Mã của bạn: <span id="my-room-code">----</span></p>
        <div>
            <input type="text" id="enemy-id-input" placeholder="Mã bạn bè" maxlength="4">
            <button id="btn-connect">Kết nối</button>
        </div>
    </div>

    <div id="controls-box" style="display: none; margin-top: 4px;">
        <button id="btn-random">🎲 Xếp ngẫu nhiên</button>
        <button id="btn-manual">✋ Tự xếp tàu</button>
        <button id="btn-ready" disabled>✅ Sẵn sàng</button>
        <button id="btn-airstrike" disabled>💣 Bom Rải Thảm</button>
        <button id="btn-cam-mic">📹 Bật Cam/Mic</button>
    </div>
</div>

<div id="setup-panel">
    <span style="font-size:11px; color:#ffd700;">HƯỚNG DẪN: Chạm để chọn tàu ở dưới, sau đó chạm vào Bàn Cờ để đặt.</span>
    <div class="ship-list" id="ship-list"></div>
    <button id="btn-rotate">🔄 Xoay hướng: <span id="rotate-label">Ngang</span></button>
    <button id="btn-undo-ship" disabled>↩️ Xóa tàu vừa đặt</button>
    <button id="btn-confirm-setup" disabled>✅ Xong</button>
</div>

<div class="main-container">
    <!-- Khu vực hiển thị tin nhắn bay -->
    <div id="danmaku-container"></div>
    
    <!-- PIP Camera -->
    <div id="media-container" style="display: none;">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
    </div>

    <div class="board-section">
        <h3>🎯 Vùng biển Địch</h3>
        <div id="enemy-board" class="board"></div>
        <div class="hp-bar" id="enemy-hp"></div>
    </div>

    <div class="chat-input">
        <input type="text" id="chat-input" placeholder="Nhập tin nhắn để châm chọc...">
        <button onclick="sendChat()">Gửi</button>
    </div>

    <div class="board-section">
        <h3>🛡️ Vùng biển của Bạn</h3>
        <div id="my-board" class="board"></div>
        <div class="hp-bar" id="my-hp"></div>
    </div>
</div>

<script>
    // --- KHỞI TẠO PEERJS & KẾT NỐI ---
    const ROOM_PREFIX = "hc-pro-";
    const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    function generateRoomCode() {
        let code = "";
        for (let i = 0; i < 4; i++) code += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
        return code;
    }

    let myRoomCode = generateRoomCode();
    let peer = null;
    let conn = null;
    let mediaCall = null;
    let localStream = null;

    function initPeer() {
        peer = new Peer(ROOM_PREFIX + myRoomCode);
        peer.on('open', () => {
            document.getElementById('my-room-code').innerText = myRoomCode;
            document.getElementById('status-text').innerText = "Chờ bạn bè nhập mã...";
        });
        
        // Nhận kết nối data
        peer.on('connection', (connection) => {
            if (conn && conn.open) return; // Chỉ nhận 1 người
            conn = connection;
            isHost = true;
            setupConnection();
        });

        // Nhận cuộc gọi Video/Audio
        peer.on('call', (call) => {
            if (!localStream) {
                // Nếu chưa bật cam/mic, báo người dùng
                spawnDanmaku("Đối thủ đang gọi Video. Hãy bật Cam/Mic để phản hồi!", false);
                return;
            }
            call.answer(localStream);
            call.on('stream', (remoteStream) => {
                document.getElementById('media-container').style.display = 'flex';
                document.getElementById('remote-video').srcObject = remoteStream;
            });
        });

        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') { myRoomCode = generateRoomCode(); initPeer(); }
        });
    }
    initPeer();

    // --- BIẾN TRẠNG THÁI GAME ---
    const myBoardEl = document.getElementById('my-board');
    const enemyBoardEl = document.getElementById('enemy-board');
    const statusText = document.getElementById('status-text');
    let myShips = new Array(100).fill(0);
    let enemyHpRemaining = 17, myHpRemaining = 17;
    let isHost = false, enemyReady = false, myReady = false, myTurn = false, gameStarted = false;
    let hasAirstrike = true, airstrikeMode = false;

    // --- TẠO BÀN CỜ & RESPONSIVE ---
    function createGrid(element, isEnemy) {
        element.innerHTML = '';
        for (let i = 0; i < 100; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.dataset.idx = i;
            if (isEnemy) cell.addEventListener('click', () => fireAt(i));
            // Sự kiện cho lúc xếp tàu (bàn cờ của mình)
            if (!isEnemy) {
                cell.addEventListener('click', () => placeShipAt(i));
                cell.addEventListener('mouseenter', () => showPreview(i));
                cell.addEventListener('mouseleave', clearPreview);
            }
            element.appendChild(cell);
        }
    }
    createGrid(myBoardEl, false);
    createGrid(enemyBoardEl, true);

    function resizeBoards() {
        const boardSections = document.querySelectorAll('.board-section');
        const sectionWidth = boardSections[0].clientWidth - 8;
        let minHeight = Infinity;
        boardSections.forEach(sec => {
            const reserved = 30; // h3 + hp bar
            const available = sec.clientHeight - reserved;
            if (available < minHeight) minHeight = available;
        });
        let size = Math.floor(Math.min(sectionWidth, minHeight)) - 2;
        if (size < 100) size = 100; if (size > 420) size = 420;
        document.querySelectorAll('.board').forEach(b => { b.style.width = size + 'px'; b.style.height = size + 'px'; });
    }
    window.addEventListener('resize', resizeBoards);
    setTimeout(resizeBoards, 100);

    // --- NÚT KẾT NỐI ---
    document.getElementById('btn-connect').addEventListener('click', () => {
        const code = document.getElementById('enemy-id-input').value.trim().toUpperCase();
        if (code.length < 4) { alert("Nhập mã 4 ký tự!"); return; }
        document.getElementById('btn-connect').innerText = "Đang nối...";
        conn = peer.connect(ROOM_PREFIX + code, { reliable: true });
        isHost = false;
        setTimeout(() => { if (!conn.open) document.getElementById('btn-connect').innerText = "Thử lại"; }, 5000);
        setupConnection();
    });

    function setupConnection() {
        conn.on('open', () => {
            document.getElementById('connection-box').style.display = 'none';
            document.getElementById('controls-box').style.display = 'block';
            statusText.innerText = "Đã kết nối! Hãy xếp tàu.";
            spawnDanmaku("Đã kết nối thành công!", true);
            setTimeout(resizeBoards, 50);
        });
        conn.on('data', (data) => {
            if (data.type === 'chat') spawnDanmaku(data.text, false);
            else if (data.type === 'ready') { enemyReady = true; checkGameStart(); }
            else if (data.type === 'fire') handleIncomingFire(data);
            else if (data.type === 'fire-result') handleFireResult(data);
        });
    }

    // --- CHAT DANMAKU ---
    function sendChat() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (text && conn && conn.open) {
            conn.send({ type: 'chat', text: text });
            spawnDanmaku(text, true);
            input.value = '';
        }
    }
    function spawnDanmaku(text, isMe) {
        const container = document.getElementById('danmaku-container');
        const el = document.createElement('div');
        el.className = 'danmaku-msg';
        el.innerText = text;
        el.style.color = isMe ? 'var(--accent-blue)' : '#ff4b1f';
        el.style.top = Math.floor(Math.random() * 60 + 10) + '%'; // Hiện ngẫu nhiên theo chiều dọc
        container.appendChild(el);
        setTimeout(() => el.remove(), 6000); // Xóa sau khi chạy xong animation
    }

    // --- WEBRTC CAMERA & MICRO ---
    document.getElementById('btn-cam-mic').addEventListener('click', async () => {
        const btn = document.getElementById('btn-cam-mic');
        if (!localStream) {
            try {
                // Tối ưu độ phân giải thấp cho máy RAM ít
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 320, height: 240, frameRate: 15 }, 
                    audio: true 
                });
                document.getElementById('media-container').style.display = 'flex';
                document.getElementById('local-video').srcObject = localStream;
                btn.innerText = "🛑 Tắt Cam/Mic";
                
                // Giao tiếp với đối phương nếu đã kết nối
                if (conn && conn.open) {
                    const peerIdToCall = isHost ? conn.peer : conn.peer; 
                    mediaCall = peer.call(peerIdToCall, localStream);
                    mediaCall.on('stream', (remoteStream) => {
                        document.getElementById('remote-video').srcObject = remoteStream;
                    });
                }
            } catch (err) {
                alert("Không thể mở Camera/Micro. Vui lòng cấp quyền trình duyệt.");
            }
        } else {
            // Tắt stream
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
            document.getElementById('media-container').style.display = 'none';
            btn.innerText = "📹 Bật Cam/Mic";
            if (mediaCall) mediaCall.close();
        }
    });

    // --- LOGIC XẾP TÀU (TAP TO PLACE) ---
    const SHIP_LENGTHS = [5, 4, 3, 3, 2];
    let manualMode = false, isHorizontal = true, selectedShipIndex = null, placedShips = [];
    
    document.getElementById('btn-random').addEventListener('click', () => {
        resetBoardState();
        document.getElementById('setup-panel').style.display = 'none';
        SHIP_LENGTHS.forEach(len => {
            let placed = false;
            while (!placed) {
                const horiz = Math.random() > 0.5;
                const start = Math.floor(Math.random() * 100);
                const cells = getPreviewCells(start, len, horiz);
                if (cells && !cells.some(c => myShips[c] !== 0)) {
                    cells.forEach(c => { myShips[c] = 1; myBoardEl.children[c].classList.add('ship'); });
                    placedShips.push({ length: len, cells });
                    placed = true;
                }
            }
        });
        markAllShipShapes();
        document.getElementById('btn-ready').disabled = false;
    });

    document.getElementById('btn-manual').addEventListener('click', () => {
        resetBoardState();
        manualMode = true; isHorizontal = true; selectedShipIndex = null;
        document.getElementById('setup-panel').style.display = 'block';
        renderShipList();
    });

    document.getElementById('btn-rotate').addEventListener('click', () => {
        isHorizontal = !isHorizontal;
        document.getElementById('rotate-label').innerText = isHorizontal ? "Ngang" : "Dọc";
    });

    function renderShipList() {
        const list = document.getElementById('ship-list');
        list.innerHTML = '';
        SHIP_LENGTHS.forEach((len, i) => {
            const btn = document.createElement('div');
            btn.className = 'ship-choice';
            btn.innerText = `Tàu ${len} ô`;
            btn.onclick = () => {
                if (btn.classList.contains('placed')) return;
                document.querySelectorAll('.ship-choice').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedShipIndex = i;
            };
            list.appendChild(btn);
        });
        syncShipListWithPlaced();
    }

    function getPreviewCells(startIdx, len, horiz) {
        const x = startIdx % 10, y = Math.floor(startIdx / 10);
        if (horiz && x + len > 10) return null;
        if (!horiz && y + len > 10) return null;
        let cells = [];
        for (let i = 0; i < len; i++) cells.push(horiz ? startIdx + i : startIdx + i * 10);
        return cells;
    }

    function showPreview(idx) {
        if (!manualMode || selectedShipIndex === null) return;
        clearPreview();
        const len = SHIP_LENGTHS[selectedShipIndex];
        const cells = getPreviewCells(idx, len, isHorizontal);
        if (!cells) return;
        const bad = cells.some(c => myShips[c] !== 0);
        cells.forEach(c => myBoardEl.children[c].classList.add(bad ? 'ship-preview-bad' : 'ship-preview'));
    }
    
    function clearPreview() {
        Array.from(myBoardEl.children).forEach(c => c.classList.remove('ship-preview', 'ship-preview-bad'));
    }

    function placeShipAt(idx) {
        if (!manualMode || selectedShipIndex === null) return;
        const len = SHIP_LENGTHS[selectedShipIndex];
        const cells = getPreviewCells(idx, len, isHorizontal);
        if (!cells || cells.some(c => myShips[c] !== 0)) return; // Bị vướng

        cells.forEach(c => { myShips[c] = 1; myBoardEl.children[c].classList.add('ship'); });
        placedShips.push({ length: len, index: selectedShipIndex, cells });
        
        clearPreview();
        markAllShipShapes();
        syncShipListWithPlaced();
    }

    function syncShipListWithPlaced() {
        const buttons = document.querySelectorAll('.ship-choice');
        buttons.forEach(b => b.classList.remove('placed', 'selected'));
        placedShips.forEach(s => buttons[s.index].classList.add('placed'));
        
        selectedShipIndex = null;
        document.getElementById('btn-confirm-setup').disabled = placedShips.length < SHIP_LENGTHS.length;
        document.getElementById('btn-undo-ship').disabled = placedShips.length === 0;
    }

    document.getElementById('btn-undo-ship').addEventListener('click', () => {
        if (placedShips.length === 0) return;
        const lastShip = placedShips.pop();
        lastShip.cells.forEach(idx => { myShips[idx] = 0; myBoardEl.children[idx].classList.remove('ship'); });
        markAllShipShapes();
        syncShipListWithPlaced();
    });

    document.getElementById('btn-confirm-setup').addEventListener('click', () => {
        document.getElementById('setup-panel').style.display = 'none';
        document.getElementById('btn-ready').disabled = false;
    });

    function resetBoardState() {
        myShips.fill(0); placedShips = [];
        Array.from(myBoardEl.children).forEach(c => c.className = 'cell');
        document.getElementById('btn-ready').disabled = true;
    }

    function markAllShipShapes() {
        Array.from(myBoardEl.children).forEach(c => c.classList.remove('ship-h-mid', 'ship-end-left', 'ship-end-right', 'ship-end-top', 'ship-end-bottom', 'ship-single'));
        for (let idx = 0; idx < 100; idx++) {
            if (myShips[idx] !== 1) continue;
            const x = idx % 10, y = Math.floor(idx / 10);
            const l = x > 0 && myShips[idx - 1] === 1, r = x < 9 && myShips[idx + 1] === 1;
            const u = y > 0 && myShips[idx - 10] === 1, d = y < 9 && myShips[idx + 10] === 1;
            const cell = myBoardEl.children[idx];
            if (!l && !r && !u && !d) cell.classList.add('ship-single');
            else if (l || r) cell.classList.add(!l ? 'ship-end-left' : (!r ? 'ship-end-right' : 'ship-h-mid'));
            else if (u || d) cell.classList.add(!u ? 'ship-end-top' : (!d ? 'ship-end-bottom' : 'ship-h-mid'));
        }
    }

    // --- LOGIC GAMEPLAY (Bắn phá) ---
    document.getElementById('btn-ready').addEventListener('click', () => {
        myReady = true;
        document.getElementById('btn-random').style.display = 'none';
        document.getElementById('btn-manual').style.display = 'none';
        document.getElementById('btn-ready').style.display = 'none';
        statusText.innerText = "Đang chờ địch...";
        conn.send({ type: 'ready' });
        checkGameStart();
    });

    function checkGameStart() {
        if (myReady && enemyReady) {
            gameStarted = true; myTurn = isHost;
            document.getElementById('btn-airstrike').disabled = false;
            updateTurnUI();
        }
    }

    function updateTurnUI() {
        statusText.innerText = myTurn ? "🎯 ĐẾN LƯỢT BẠN! Chọn mục tiêu." : "⏳ Đối thủ đang nhắm bắn...";
        statusText.style.color = myTurn ? "var(--accent-green)" : "#a1a1aa";
    }

    document.getElementById('btn-airstrike').addEventListener('click', () => {
        if (!myTurn || !hasAirstrike || !gameStarted) return;
        airstrikeMode = !airstrikeMode;
        const btn = document.getElementById('btn-airstrike');
        btn.classList.toggle('active');
        btn.innerText = airstrikeMode ? "🔥 CHỌN TÂM BOM" : "💣 Bom Rải Thảm";
    });

    function fireAt(idx) {
        if (!gameStarted || !myTurn) return;
        const cell = enemyBoardEl.children[idx];
        if (cell.classList.contains('hit') || cell.classList.contains('miss')) return;

        myTurn = false;
        conn.send({ type: 'fire', index: idx, isAirstrike: airstrikeMode });
        
        if (airstrikeMode) {
            hasAirstrike = false; airstrikeMode = false;
            const btn = document.getElementById('btn-airstrike');
            btn.disabled = true; btn.classList.remove('active'); btn.innerText = "❌ Hết Bom";
        }
    }

    function handleIncomingFire(data) {
        let targets = [data.index];
        if (data.isAirstrike) {
            spawnDanmaku("⚠️ ĐỊCH DÙNG BOM RẢI THẢM!", false);
            const x = data.index % 10, y = Math.floor(data.index / 10);
            if (x > 0) targets.push(data.index - 1); if (x < 9) targets.push(data.index + 1);
            if (y > 0) targets.push(data.index - 10); if (y < 9) targets.push(data.index + 10);
        }
        let hits = [], misses = [];
        targets.forEach(idx => {
            if (myShips[idx] === 1) { hits.push(idx); myShips[idx] = -1; myHpRemaining--; myBoardEl.children[idx].classList.add('hit'); }
            else if (myShips[idx] === 0) { misses.push(idx); myShips[idx] = -2; myBoardEl.children[idx].classList.add('miss'); }
        });

        document.getElementById('my-hp').innerText = `Tàu còn lại: ${myHpRemaining}/17`;
        const gameOver = myHpRemaining <= 0;
        conn.send({ type: 'fire-result', hits, misses, gameOver });

        if (gameOver) { statusText.innerText = "BẠN ĐÃ BỊ TIÊU DIỆT! 💥"; gameStarted = false; } 
        else { myTurn = true; updateTurnUI(); }
    }

    function handleFireResult(data) {
        data.hits.forEach(idx => enemyBoardEl.children[idx].classList.add('hit'));
        data.misses.forEach(idx => enemyBoardEl.children[idx].classList.add('miss'));
        if (data.hits.length > 0) enemyHpRemaining -= data.hits.length;
        document.getElementById('enemy-hp').innerText = `Sinh lực địch: ${enemyHpRemaining}/17`;

        if (data.gameOver) { statusText.innerText = "CHIẾN THẮNG! 🏆"; spawnDanmaku("BẠN ĐÃ THẮNG!", true); gameStarted = false; } 
        else { myTurn = false; updateTurnUI(); }
    }
    
    document.getElementById('my-hp').innerText = `Tàu còn lại: 17/17`;
    document.getElementById('enemy-hp').innerText = `Sinh lực địch: 17/17`;
</script>
</body>
</html>
